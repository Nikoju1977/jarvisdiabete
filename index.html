<!doctype html>
<html lang="fr">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#071421">
 <meta http-equiv="refresh" content="0;url=./diabcare/">
 <meta name="robots" content="noindex">
 <title>DiabCare — Assistant DT1</title>
 <link rel="manifest" href="./manifest.json">
 <link rel="icon" href="./diabcare/icon.svg" type="image/svg+xml">
 <style>
 :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#071421;color:#eaf6ff}
 *{box-sizing:border-box}
 body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 30%,#19395f 0%,#071421 70%)}
 main{max-width:440px;text-align:center}
 h1{font-size:clamp(2rem,7vw,3.2rem);margin:12px 0;letter-spacing:-.06em}
 p{line-height:1.65;color:#bfd2e5}
 a{display:inline-block;margin-top:12px;background:#7be9d3;color:#071421;border-radius:14px;padding:14px 22px;font-weight:800;text-decoration:none}
 .mark{width:78px;height:78px;display:grid;place-items:center;margin:0 auto;background:#183e62;color:#a8eeff;border:2px solid #60bcdb;border-radius:24px;font-size:2.3rem;font-weight:800}
 </style>
 <script>location.replace(new URL("./diabcare/",location.href).href);</script>
</head>
<body>
<main>
 <div class="mark" aria-hidden="true">D</div>
 <h1>DiabCare</h1>
 <p>Votre assistant vocal spécialisé dans le diabète de type 1. Ouverture de l'application…</p>
 <a href="./diabcare/">Ouvrir DiabCare</a>
 <p><small>Les données de l'ancienne interface ne sont pas transférées automatiquement.</small></p>
</main>
</body>
</html>
