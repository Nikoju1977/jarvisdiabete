name: DiabCare PWA checks
on:
  push:
    branches: [main, diabcare-pwa]
    paths: ['diabcare/**', '.github/workflows/diabcare-checks.yml']
  pull_request:
    paths: ['diabcare/**', '.github/workflows/diabcare-checks.yml']
permissions:
  contents: read
jobs:
  static-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe JavaScript
        run: |
          node --check diabcare/app.mjs
          node --check diabcare/core.mjs
          node --check diabcare/vault.mjs
          node --check diabcare/model.mjs
          node --check diabcare/voice.mjs
          node --check diabcare/speech-policy.mjs
          node --check diabcare/speech-offline.mjs
          node --check diabcare/nutrition.mjs
          node --check diabcare/specialists.mjs
          node --check diabcare/llm-sources.mjs
          node --check api/diabcare-chat.mjs
          node --check diabcare/sw.js
      - name: Tests locaux déterministes
        run: node --test diabcare/*.test.mjs api/diabcare-chat.test.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Démarrer le serveur local PWA
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/diabcare-http.log 2>&1 &
          sleep 2
      - name: Tester les clics en viewport Android et iPhone
        run: node diabcare/browser-smoke.mjs
